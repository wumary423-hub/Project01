name: Validate Specifications

on:
  push:
    paths:
      - "spec-manifest.yaml"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/validate-specs.yml"
  pull_request:
    paths:
      - "spec-manifest.yaml"
      - "docs/**"
      - "tools/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements-specs.txt
      - run: python tools/validate_specs.py
