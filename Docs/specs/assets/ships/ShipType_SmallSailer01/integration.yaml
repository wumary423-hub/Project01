schema_version: 3
contract_version: 1.0.0

asset:
  asset_id: ShipType_SmallSailer01
  asset_type: ship
  title_zh: 小型单桅沿岸商船
  working_name: SmallSailer01
  former_starter_id: SHIP-0001
  status: REVIEW
  design_spec: Docs/specs/assets/ships/ShipType_SmallSailer01/design.md
  system_spec: Docs/specs/systems/ship-system/ship-system.md
  catalog_row: ShipType_SmallSailer01
  catalog_table: /Game/Ship/DT_Ships
  material_card: MAT-001

full_effect_concept:
  status: PENDING
  revision: null
  path: null
  role: style_and_whole_ship_identity
  user_approval_required: true

production_workflow:
  version: component_first_v1
  current_stage: full_effect_concept
  deprecated_whole_ship_multiview_pipeline_allowed: false
  stages:
    - full_effect_concept
    - component_breakdown_and_reuse_check
    - primary_component_production_and_validation
    - other_component_production_or_reuse
    - blender_ship_assembly
    - ue5_game_asset

dimensions:
  length_m: {value: 15, status: LOCKED}
  beam_m: {value: null, status: UNSET}
  draft_m: {value: null, status: UNSET}
  main_mast_length_m:
    value: 18
    status: LOCKED
    measurement: mast_step_to_masthead

coordinate_system:
  blender_forward: "+X"
  blender_starboard: "+Y"
  blender_up: "+Z"
  blender_unit: meter
  ue_forward_axis: {value: X, status: REVIEW}
  ue_up_axis: {value: Z, status: REVIEW}
  ue_unit: centimeter
  pivot_definition: {value: null, status: UNSET}

modules:
  hull:
    required: true
    separate_mesh: true
    current_validation_target: true
    filename: SM_SmallSailer01_Hull.fbx
    built_in_gunports_allowed: false
    excludes: [deck, gunports, sternhouse, hatch, stairs, mast, yard, crows_nest, bowsprit, sails, rigging, rudder, anchor, lamps, capstan, decor, loose_props]
  deck:
    required: true
    separate_mesh: true
    current_validation_companion: true
    simple_scalable_board: true
    manual_scale_and_height_alignment_allowed: true
    filename: SM_SmallSailer01_Deck.fbx
  gunport:
    required: true
    separate_reusable_module: true
    current_validation_scope: false
    total_instances: 4
    port_instances: 2
    starboard_instances: 2
    uniform_size_required: true
    bilateral_correspondence_required: true
    built_into_hull: false
    boolean_cutter_required: true
    cannon_anchor_required: true
    installed_cannon_count_locked: false
    filename: SM_SmallSailer01_Gunport.fbx
  stern_superstructure:
    required: true
    separate_during_production: true
    current_validation_scope: false
    recursive_component_breakdown_allowed: true
  mast_rig_01:
    required: true
    separate_mesh: true
    current_validation_scope: false
    hang_socket: Attach_MastRig_01
    centerline_required: true
    length_m: 18
    length_status: LOCKED
  rudder:
    required: true
    separate_mesh: true
    current_validation_scope: false
    hang_socket: Attach_Rudder
    mounting: stern_centerline
  flag:
    required: true
    separate_mesh: true
    current_validation_scope: false
    hang_socket: Attach_Flag
    hang_host: MastRig
  figurehead:
    actual_asset_required: false
    separate_mesh: true
    current_validation_scope: false
    hang_socket: Attach_Figurehead
    hang_host: Hull

interfaces:
  mast_mount: {required: true, name: Attach_MastRig_01, host: Hull}
  rudder_mount: {required: true, name: Attach_Rudder, host: Hull}
  flag_socket: {required: true, name: Attach_Flag, host: MastRig}
  figurehead_socket: {required: true, name: Attach_Figurehead, host: Hull}
  gunport_cannon_socket:
    required: true
    name: Attach_Cannon
    host: Gunport
    repeated_per_instance: true
  crew_sockets: {allowed: false}

ship_layout:
  historical_prototype: "Cog (ship)"
  single_mast: true
  single_main_deck: true
  main_cargo_hatch_count: 1
  main_cargo_hatch_alignment: longitudinal_centerline_aft_of_mast
  sternhouse_levels: 1
  sternhouse_floor_same_level_as_main_deck: true
  stern_stairs_count: 1
  stern_stairs_side: starboard
  stern_stairs_inside_hull: true
  rudder_alignment: stern_centerline
  bowsprit_required_in_final_ship: true
  main_yard_required_in_final_ship: true
  crows_nest_required_in_final_ship: true
  decorative_barrels_allowed: false
  loose_clutter_allowed: false

ai_3d:
  primary_tool: tripo_3d
  generation_target: hull_only
  expected_output_path: assets/ships/ShipType_SmallSailer01/tripo3d/hull/
  component_reference_pack_required: true
  whole_ship_final_multiview_required: false
  first_pass_texture_required: false
  output_is_intermediate: true
  blender_cleanup_required: true

blender:
  assembly_authority: true
  symmetry_check_required: true
  topology_cleanup_required: true
  component_scale_alignment_required: true
  uv_required_before_ue: true
  lod_required: true
  collision_required: true
  output_path: assets/ships/ShipType_SmallSailer01/blender/

job_layout_2d:
  required: true
  view: perspective_side
  bow_direction: left
  strict_structural_match_to_3d: true
  status: REVIEW

ue5:
  destination_path: /Game/Ships/ShipType_SmallSailer01/
  mesh_folder: /Game/Ships/ShipType_SmallSailer01/Mesh/
  disk_fbx_inbox: Content/Ships/ShipType_SmallSailer01/Mesh/
  lod_required: true
  collision_required: true
  output_path: assets/ships/ShipType_SmallSailer01/ue5/

forbidden:
  - restore_deprecated_whole_ship_line_or_multiview_pipeline
  - use_old_workflow_images_or_prompts_as_input
  - build_gunports_into_hull_validation_mesh
  - add_decor_or_nonessential_props_to_hull_validation
  - invent_unapproved_dimensions
  - add_crew_sockets
  - change_locked_ship_length_or_main_mast_length_without_approval
