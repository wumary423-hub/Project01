reference_master:
  revision: "1"
  status: LOCKED
  role: hull_deck_stern_structural_reference
  intended_path: assets/ships/ShipType_SmallSailer01/reference/ShipType_SmallSailer01_reference-master_r1.png
  source_session_filename: 木制帆船结构技术插画.png
  source_dimensions_px: [1449, 1086]
  source_sha256: 327d646918cfb43a3a8c6347151da0944e8c1187018f3090fa6279f19f44456b
  binary_repository_status: PENDING_IMPORT
  decision_record: Docs/specs/assets/ships/ShipType_SmallSailer01/decisions/ADR-0006-reference-master-r1.md
  rigging_and_sails_intentionally_omitted_for_structure_readability: true
  yard_and_crows_nest_retained: true
  omission_does_not_forbid_final_rigging_or_sails: true

dimensions:
  length_m:
    value: 15
    status: LOCKED
    note: fixed ship design length
  beam_m:
    value: null
    status: UNSET
  draft_m:
    value: null
    status: UNSET
  height_without_mast_m:
    value: null
    status: UNSET
  main_mast_length_m:
    value: 18
    status: LOCKED
    measurement: mast_step_to_masthead
  main_mast_length_to_ship_length_ratio:
    value: 1.2
    derived: true
    note: derived from locked 18m mast length / locked 15m ship length

coordinate_system:
  ue_forward_axis:
    value: X
    status: REVIEW
  ue_up_axis:
    value: Z
    status: REVIEW
  unit:
    value: centimeter
    status: REVIEW
  blender_forward: "+X"
  blender_apply_rotation_and_scale: true
  pivot_definition:
    value: null
    status: UNSET

modules:
  hull:
    required: true
    separate_mesh: true
    role: AFleet_root_static_mesh
    catalog_field: FShipDefinition.Mesh
    filename: SM_SmallSailer01_Hull.fbx
  stern_superstructure:
    required: true
    separate_mesh: false
    note: welded to hull for v0; low one-level wooden sternhouse, floor at main-deck level, walkable roof platform with railing
  mast_rig_01:
    required: true
    separate_mesh: true
    scheme: A
    whole_package: true
    contains:
      - mast
      - yards
      - sail
      - minimal_rigging
    not_separate_ue_meshes:
      - Mast_Main
      - Yard_Main
      - Sail_Main
    meshy_may_block_out_parts_separately: true
    blender_must_deliver_as_package: true
    hang_socket: Attach_MastRig_01
    hang_host: Hull
    centerline_required: true
    length_m: 18
    length_status: LOCKED
    length_must_exceed_ship_length: true
    rig_types_phase_one:
      - Square
      - Lateen
    rig_types_compatible_deferred:
      - Gaff
    states:
      - Full
      - Half
      - Furled
    filename_pattern: SM_SmallSailer01_MastRig01_<RigType>_<State>
    active_one_rigtype_at_a_time: true
    starter_default_rigtype:
      value: null
      status: UNSET
    flag_socket_on_this_mesh: Attach_Flag
  headsail_01:
    hull_socket_required: true
    hull_socket_name: Attach_Headsail_01
    separate_mesh: true
    mesh_on_starter_loadout: false
    filename_pattern: SM_SmallSailer01_Headsail01_<State>
    states:
      - Full
      - Half
      - Furled
  bowsprit:
    required: true
    separate_mesh: false
    note: hull structure; do not delete
  rudder:
    required: true
    separate_mesh: true
    mounting: stern_centerline
    hang_socket: Attach_Rudder
    hang_host: Hull
    filename: SM_SmallSailer01_Rudder.fbx
  flag:
    required: true
    separate_mesh: true
    replaceable: true
    hang_socket: Attach_Flag
    hang_host: MastRig
    hide_when_rig_hidden_or_mast_broken: true
    filename: SM_SmallSailer01_Flag_Placeholder.fbx
  figurehead:
    actual_asset_required: false
    separate_mesh: true
    replaceable: true
    hang_socket: Attach_Figurehead
    hang_host: Hull
    filename: SM_SmallSailer01_Figurehead_Placeholder.fbx
  anchor:
    required: true
    separate_mesh: true
    hang_socket: Attach_Anchor
    hang_host: Hull
    filename: SM_SmallSailer01_Anchor.fbx
  mast_broken:
    required: true
    separate_mesh: true
    hang_socket: Attach_Mast_Broken
    hang_host: Hull
    filename: SM_SmallSailer01_MastBroken.fbx

interfaces:
  pontoon_bow:
    required: true
    name: Pontoon_Bow
    host: Hull
    missing_severity: Error
  pontoon_stern:
    required: true
    name: Pontoon_Stern
    host: Hull
    missing_severity: Error
  pontoon_port:
    required: true
    name: Pontoon_Port
    host: Hull
    missing_severity: Error
  pontoon_starboard:
    required: true
    name: Pontoon_Starboard
    host: Hull
    missing_severity: Error
  mast_mount:
    required: true
    name: Attach_MastRig_01
    host: Hull
    centerline_required: true
    deprecated_alias: Attach_Sail_Main
  flag_socket:
    required: true
    name: Attach_Flag
    host: MastRig
    status: REVIEW
  figurehead_socket:
    required: true
    name: Attach_Figurehead
    host: Hull
    status: REVIEW
  rudder_mount:
    required: true
    name: Attach_Rudder
    host: Hull
    stern_centerline_required: true
  anchor_socket:
    required: true
    name: Attach_Anchor
    host: Hull
  fx_fire:
    required: true
    name: Attach_FX_Fire
    host: Hull
  mast_broken_socket:
    required: true
    name: Attach_Mast_Broken
    host: Hull
  headsail_socket:
    required: true
    name: Attach_Headsail_01
    host: Hull
  weapon_port_01:
    required: true
    name: Attach_Weapon_Port_01
    host: Hull
    mesh_optional_v0: true
  weapon_starboard_01:
    required: true
    name: Attach_Weapon_Starboard_01
    host: Hull
    mesh_optional_v0: true
  crew_sockets:
    allowed: false

hull_openings:
  gunports:
    structural_feature: true
    total_count: 4
    port_count: 2
    starboard_count: 2
    mirror_axis: longitudinal_centerline
    bilateral_mirror_required: true
    uniform_size_required: true
    deck_level: top_deck
    other_deck_levels_allowed: false
    note: Structural hull openings only; does not define installed weapon count or require one weapon socket per gunport.

deck:
  main_cargo_hatch:
    count: 1
    cover_panels_allowed: true
    relative_size: compact
    must_not_dominate_main_deck: true
    overlap_with_main_mast_or_mast_step_allowed: false
    must_clear_main_mast_footprint: true
  stairs_to_stern_platform:
    required: true
    count: 1
    placement: adjacent_to_ship_side
    inside_hull_required: true
    centerline_allowed: false
    lower_endpoint: main_deck
    upper_endpoint: sternhouse_roof_platform
    side:
      value: starboard
      status: LOCKED
      allowed_values:
        - port
        - starboard
    forward_of_stern_cabin_required: true
    buried_inside_solid_cabin_allowed: false
    double_symmetric_stairs_allowed: false
  decorative_barrels:
    allowed_in_base_asset: false
  loose_clutter:
    allowed_in_base_asset: false

visual_constraints:
  preserve_v0_8_bow_midship_transition: true
  preserve_v0_8_midship_stern_transition: true
  stern_canvas_canopy_allowed: false
  low_one_level_wooden_sternhouse_required: true
  sternhouse_floor_same_level_as_main_deck: true
  sternhouse_roof_walkable_platform_required: true
  sternhouse_roof_railing_required: true
  small_functional_windows_required: true
  sternhouse_wood_same_material_system_as_hull: true
  dark_external_bands_must_read_as_wood: true
  expanded_sail_allowed_in_hull_concept: false

view_and_detail:
  typical_gameplay_distance_m: [50, 200]
  extreme_minimum_readable_distance_m: 10
  note: 50-200m is normal strategic view; 10m is extreme close, not a conflict

cargo_visualization:
  generate_by_commodity_type: false
  generate_by_quantity: false

job_layout_2d:
  required: true
  view: perspective_side
  bow_direction: left
  size: 2048x1024
  transparent: true
  margin_percent: [8, 10]
  baked_hotspots_allowed: false
  strict_structural_match_to_3d: true
  filename: T_SmallSailer01_OutfitDiagram.png
  asset_path: Content/UI/Ship/ or Content/Ship/UI/
  status: REVIEW
  slot_ids:
    - OutfitSlot_CaptainCabin
    - OutfitSlot_Deck
    - OutfitSlot_GunDeck
    - OutfitSlot_ChartRoom
    - OutfitSlot_Lookout
    - OutfitSlot_Sails
    - OutfitSlot_CannonRefit

meshy:
  generation_target: hull_base
  remove_expanded_sails: true
  simplify_rigging: true
  remove_loose_deck_props: true
  preserve_locked_silhouette: true
  expected_output_path: assets/ships/ShipType_SmallSailer01/meshy/

blender:
  symmetry_check_required: true
  topology_cleanup_required: true
  modularization_required: true
  uv_required: true
  material_slots_required: true
  lod_required: true
  collision_required: true
  output_path: assets/ships/ShipType_SmallSailer01/blender/
  one_fbx_per_asset: true
  shared_geometry_blockout:
    status: APPROVED
    path: assets/ships/ShipType_SmallSailer01/blender/ShipType_SmallSailer01_blockout.blend
    sha256: 7ef92e5dcbf32ba4592731495ba6acb27e476b4f0011898c00f3b8fa47d113a4
    approved_commit: 395dba69a46ac050fb2a612203e3341458b8748c
    geometry_shared: true
    role: structure_review_and_drawing_aid
    not_ue_mesh: true
    ortho_cameras:
      status: APPROVED
      views: [top, port, starboard, bow, stern]
      unified_ortho_scale: 48.50
      note: framing locked with approved review PNGs; do not scale views independently

