schema_version: 1
system_id: SYS-SHIP
contract_version: 0.5.0
status: LOCKED
decision_record: docs/specs/systems/ship-system/decisions/ADR-0002-cabin-stations-and-type-groups.md

asset_pair:
  ship_3d_required: true
  job_layout_2d_required: true
  structural_consistency_required: true

view_and_detail:
  typical_gameplay_distance_m: [50, 200]
  extreme_minimum_readable_distance_m: 10
  priority_order: [hull_outline, deck_and_superstructure, rig_silhouette, functional_parts, small_decor]

component_production:
  component_first: true
  reuse_before_new_generation: true
  blender_assembly_authority: true
  hull:
    separate_mesh: true
    gunports_built_in: false
  deck:
    separate_mesh: true
    simple_scalable_first_pass: true
  gunport:
    separate_module: true
    boolean_cutter_supported: true
    cannon_anchor_required: true

crew_sockets:
  allowed: false

catalog:
  cabin_type_table: /Game/Ship/DT_CabinTypes
  cabin_type_group_table: /Game/Ship/DT_CabinTypeGroups
  cabin_station_id_form: CabinStation_<Name>
  cabin_station_picks_one_group: true
  sail_slots_are_cabin_stations: true

job_layout_2d:
  view: perspective_side
  bow_direction: left
  size: 2048x1024
  baked_hotspots_allowed: false
  strict_match_to_3d: true
  hotspot_ids: hull_cabin_stations

workflow:
  - stage: 1
    name: Full-Effect Concept
  - stage: 2
    name: Component Breakdown and Reuse Check
  - stage: 3
    name: Primary Component Production and Validation
  - stage: 4
    name: Other Component Production or Reuse
  - stage: 5
    name: Blender Ship Assembly
  - stage: 6
    name: UE5 Game Asset

program:
  status: LOCKED
  no_aship: true
  ship_object: UShipObject
  ship_manager: UShipManagerSubsystem
  fleet_actor: AFleet
  flagship_field: FlagshipShipId
  catalog: DT_Ships
  catalog_struct: FShipDefinition
  hull_catalog: DT_ShipHulls
  save_struct: FShipSaveData
  save_schema: v8
  save_schema_when_installs_persist: v8
  first_ship_asset_id: ShipType_SmallSailer01
  ue_content_root: /Game/Ships/ShipType_SmallSailer01/
  program_spec: Docs/specs/systems/ship-system/ship-program.md
